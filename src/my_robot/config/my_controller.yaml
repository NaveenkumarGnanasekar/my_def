controller_manager:
  ros__parameters:
    update_rate: 30
    use_sim_time:  true

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster 

diff_cont:
  ros__parameters:
    publish_rate: 50.0
    base_frame_id: base_link
    left_wheel_names: ['JOINT_WHEEL_1']
    left_wheel_names: ['JOINT_WHEEL_3']
    right_wheel_names: ['JOINT_WHEEL_2']
    right_wheel_names: ['JOINT_WHEEL_4']
    wheel_separation: 0.60
    wheel_radius: 0.05

    use_stamped_vel: false




    
  